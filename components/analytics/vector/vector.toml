data_dir = "/vector-data-dir"

[sources.http-events]
type = "http_server"
address = "0.0.0.0:8282"
encoding = "json"

# Uncomment for debug
# [sinks.console]
# type = "console"
# inputs = [ "http-events" ]
# target = "stdout"

# [sinks.console.encoding]
# codec = "json"

[api]
enabled = true

[sinks.clickhouse]
inputs = [ "http-events" ]
type = "clickhouse"
database = "${CLICKHOUSE_DB}"
table = "events"
auth.strategy = "basic"
auth.user = "${CLICKHOUSE_USER}"
auth.password = "${CLICKHOUSE_PASSWORD}"
endpoint = "https://${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT}"
request.concurrency = "adaptive"
compression = "gzip"
request.timeout_secs = 360
encoding.only_fields = [
    "scope",
    "obj_name",
    "obj_id",
    "obj_val",
    "source",
    "timestamp",
    "count",
    "duration",
    "project_id",
    "task_id",
    "job_id",
    "user_id",
    "user_name",
    "user_email",
    "org_id",
    "org_slug",
    "payload",
    "access_token_id",
]
[sinks.clickhouse.buffer]
# Buffer to disk in case we loose connection for longer
# periods of time
type = "disk"
max_size = 21_474_836_480 # 20GB
